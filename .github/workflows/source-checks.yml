name: Aether source checks
on:
  pull_request:
  push:
    branches: [main, "foundation/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project structure
        run: python tools/verify_project.py
